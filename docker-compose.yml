version: "3.9"
  
services:
  backend:
    build: ./backend
    restart: always
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env

  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cars
    ports:
      - "5432:5432"
    volumes:
      # Mount the script into the official entrypoint folder
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  redis:
    image: redis:7
    ports:
      - "6379:6379"